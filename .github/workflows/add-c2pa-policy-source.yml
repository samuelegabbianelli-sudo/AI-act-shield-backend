name: Add C2PA policy trust source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: python scripts/patch_c2pa_policy.py

      - name: Verify
        run: python -m py_compile analyzer.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --check
          git commit -m "Distinguish AI Act Shield policy trust"
          git push
