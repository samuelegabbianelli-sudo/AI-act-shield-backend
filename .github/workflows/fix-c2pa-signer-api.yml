name: Fix C2PA signer API

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch C2PA signer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("analyzer.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'signer_info = C2paSignerInfo\(.*?\n\n    signer = Signer\.from_info\(',
              re.S,
          )

          replacement = '''signer_info = C2paSignerInfo(
              alg=_get_signing_algorithm(),
              sign_cert=C2PA_SIGNING_CERT_PEM.encode("utf-8"),
              private_key=C2PA_SIGNING_PRIVATE_KEY_PEM.encode("utf-8"),
              ta_url=(
                  C2PA_TIMESTAMP_URL.strip().encode("utf-8")
                  if C2PA_TIMESTAMP_URL.strip()
                  else None
              )
          )

          signer = Signer.from_info('''

          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one C2paSignerInfo block, found {count}"
              )

          compile(text2, "analyzer.py", "exec")
          path.write_text(text2, encoding="utf-8")
          print("C2PA signer API patch applied and syntax check passed.")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix C2PA signer API compatibility"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-c2pa-signer-api.yml
          git commit -m "Remove temporary C2PA signer workflow"
          git push
