name: Fix C2PA signer manually

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair C2PA signer block
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("analyzer.py"); s=p.read_text(encoding="utf-8"); s=s.replace("        cert_pem=C2PA_SIGNING_CERT_PEM,", "        sign_cert=C2PA_SIGNING_CERT_PEM.encode(\"utf-8\"),"); s=s.replace("        private_key_pem=C2PA_SIGNING_PRIVATE_KEY_PEM,", "        private_key=C2PA_SIGNING_PRIVATE_KEY_PEM.encode(\"utf-8\"),"); s=s.replace("        algorithm=_get_signing_algorithm()", "        alg=_get_signing_algorithm(),"); old="""    if C2PA_TIMESTAMP_URL.strip():\n        signer_info.timestamp_url = (\n            C2PA_TIMESTAMP_URL.strip()\n        )\n"""; new="""        ta_url=(\n            C2PA_TIMESTAMP_URL.strip().encode(\"utf-8\")\n            if C2PA_TIMESTAMP_URL.strip()\n            else None\n        )\n"""; s=s.replace(old,new,1); compile(s,"analyzer.py","exec"); p.write_text(s,encoding="utf-8")'

      - name: Verify repaired code
        shell: bash
        run: |
          grep -n -A15 -B2 "signer_info = C2paSignerInfo" analyzer.py
          python -m py_compile analyzer.py
          if grep -q "cert_pem=C2PA_SIGNING_CERT_PEM" analyzer.py; then
            echo "Old cert_pem parameter still present"
            exit 1
          fi
          if grep -q "private_key_pem=C2PA_SIGNING_PRIVATE_KEY_PEM" analyzer.py; then
            echo "Old private_key_pem parameter still present"
            exit 1
          fi
          echo "C2PA signer repair verification: PASSED"

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --check
          git commit -m "Fix C2PA signer constructor"
          git push
