name: Fix internal C2PA policy recognition

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_internal_policy.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: python scripts/fix_internal_policy.py

      - name: Commit repaired analyzer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix AI Act Shield policy recognition for remediated files"
          git push
