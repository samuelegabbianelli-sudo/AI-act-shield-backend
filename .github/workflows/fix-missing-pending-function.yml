name: Fix missing pending audit function

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("analyzer.py")
          text = path.read_text(encoding="utf-8")

          marker = "# 15. WORKER LOOP"
          if "def fetch_pending_audits(" in text:
              raise SystemExit("fetch_pending_audits already exists")
          if marker not in text:
              raise SystemExit("worker marker not found")

          function = '''def fetch_pending_audits():
              response = (
                  supabase
                  .table("audits")
                  .select(
                      "id, user_id, file_url, compliance_status, fixed_file_url"
                  )
                  .eq(
                      "compliance_status",
                      "pending"
                  )
                  .limit(10)
                  .execute()
              )

              return response.data or []


          '''

          text = text.replace(marker, function + marker, 1)
          compile(text, "analyzer.py", "exec")
          path.write_text(text, encoding="utf-8")
          print("analyzer.py missing pending function fixed; syntax OK")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --quiet || git commit -m "Restore pending audit worker query"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-missing-pending-function.yml
          git add .github/workflows/fix-missing-pending-function.yml
          git commit -m "Remove temporary pending audit fix workflow"
          git push
