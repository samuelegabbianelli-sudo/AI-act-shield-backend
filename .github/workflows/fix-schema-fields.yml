name: Fix audit schema fields

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: |
          python -c 'from pathlib import Path; p=Path("analyzer.py"); t=p.read_text(encoding="utf-8"); old="""                \"ai_detector_available\": (\n                    ai_result[\"available\"]\n                ),\n"""; assert old in t, "ai_detector_available block not found"; t=t.replace(old, "", 1); old="""                \"status\": \"error\",\n                \"error_message\": (\n                    \"File URL mancante\"\n                )\n"""; new="""                \"compliance_status\": \"manual_review\",\n                \"recommendation\": \"Errore tecnico: file URL mancante.\"\n"""; assert old in t, "missing file_url error block not found"; t=t.replace(old,new,1); old="""                \"status\": \"error\",\n                \"error_message\": str(e)\n"""; new="""                \"compliance_status\": \"manual_review\",\n                \"recommendation\": \"Errore tecnico durante l'analisi: \" + str(e)\n"""; assert old in t, "exception error block not found"; t=t.replace(old,new,1); compile(t,"analyzer.py","exec"); p.write_text(t,encoding="utf-8"); print("analyzer.py schema patch syntax OK")'

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --quiet || git commit -m "Fix audit schema field references"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-schema-fields.yml
          git add .github/workflows/fix-schema-fields.yml
          git commit -m "Remove temporary schema fix workflow"
          git push
