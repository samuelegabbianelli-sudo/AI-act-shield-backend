name: Fix audit schema fields

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("analyzer.py")
          text = path.read_text(encoding="utf-8")

          old_len = len(text)

          text, ai_count = re.subn(
              r'(?ms)^\s*"ai_detector_available":\s*\(\s*ai_result\["available"\]\s*\),\s*$',
              "",
              text,
              count=1,
          )
          if ai_count != 1:
              raise SystemExit(f"ai_detector_available block matches: {ai_count}")

          text, status_count = re.subn(
              r'"status":\s*"error",',
              '"compliance_status": "manual_review",',
              text,
          )
          if status_count < 1:
              raise SystemExit(f"error status matches: {status_count}")

          text, error_count = re.subn(
              r'"error_message":',
              '"recommendation":',
              text,
          )
          if error_count < 1:
              raise SystemExit(f"error_message matches: {error_count}")

          compile(text, "analyzer.py", "exec")
          path.write_text(text, encoding="utf-8")
          print(f"Patched analyzer.py: {old_len} -> {len(text)} chars")
          print(f"ai_detector_available removed: {ai_count}")
          print(f"error status fields replaced: {status_count}")
          print(f"error_message fields replaced: {error_count}")
          print("analyzer.py syntax OK")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --quiet || git commit -m "Fix audit schema field references"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-schema-fields.yml
          git add .github/workflows/fix-schema-fields.yml
          git commit -m "Remove temporary schema fix workflow"
          git push
