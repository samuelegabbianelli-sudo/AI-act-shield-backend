name: Fix storage download and audit error handling

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: python patch_storage.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          git diff --cached --quiet || git commit -m "Fix storage bucket resolution"
          git push

      - name: Remove temporary files
        run: |
          git rm patch_storage.py .github/workflows/fix-storage-and-error.yml
          git commit -m "Remove temporary storage patch files"
          git push
