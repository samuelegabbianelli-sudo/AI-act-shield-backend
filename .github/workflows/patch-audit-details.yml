name: Persist structured audit details

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/persist_audit_details.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch analyzer
        run: python scripts/persist_audit_details.py

      - name: Commit patched analyzer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Persist structured audit details for frontend and PDF"
          git push
